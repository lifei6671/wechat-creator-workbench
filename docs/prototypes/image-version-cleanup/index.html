<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旧版本图片清理</title>
<style>
:root{font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:#211f26;background:#f2eff3;--muted:#65636d;--line:#dbd8e0;--primary:#3e63dd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}button{font:inherit;cursor:pointer;border:.5px solid var(--line);background:#fdfcfd;color:inherit;border-radius:7px;padding:7px 12px}button:hover{background:#f2eff3}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #8da4ef;outline-offset:2px}.window{width:min(900px,100%);background:#fdfcfd;border:.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 60px #211f2616}header{display:flex;align-items:center;gap:16px;padding:20px 24px 16px}h1{font-size:18px;line-height:26px;margin:0;flex:1}header button{border:0;background:none;color:var(--muted)}nav{display:flex;gap:24px;border-bottom:.5px solid var(--line);padding:0 24px}nav button{padding:11px 0;border:0;border-radius:0;background:none;color:var(--muted);position:relative}nav button[aria-selected=true]{color:var(--primary)}nav button[aria-selected=true]:after{content:"";height:2px;background:var(--primary);position:absolute;inset:auto 0 -1px}.summary{display:flex;align-items:center;justify-content:space-between;margin:18px 24px 10px;color:var(--muted);font-size:12px}.summary strong{font-weight:500;color:#211f26}main{margin:0 24px;min-height:280px;max-height:430px;overflow:auto}.row{display:grid;grid-template-columns:20px 64px minmax(160px,1fr) 110px 75px;align-items:center;gap:14px;padding:14px 0;border-bottom:.5px solid #eae7ec}.row:last-child{border:0}.thumb{height:48px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#8da4ef,#304384);padding:7px}.thumb:after{content:"";width:100%;height:100%;border-radius:4px;background:#f7f9ff url(../image-canvas/assets/reference-desktop.png) center/cover}.mint{background:linear-gradient(135deg,#a1ded2,#008573)}.pink{background:linear-gradient(135deg,#f5a898,#8347b9)}.name{font-weight:500}.detail{font-size:12px;color:var(--muted);margin-top:3px}.size{font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.location{font-size:12px;color:var(--muted)}.lock{color:#84828e;font-size:16px}.row button{font-size:12px;padding:5px 8px}.error{color:#ce2c31;min-height:23px;font-size:12px;margin:7px 24px 0}.confirm{margin:12px 24px 0;font-size:12px;display:flex;gap:8px;align-items:flex-start}.confirm[hidden]{display:none}footer{border-top:.5px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:10px}footer .note{font-size:12px;color:var(--muted);flex:1}.primary{background:var(--primary);border-color:var(--primary);color:#fff}.primary:hover{background:#3358d4}.empty{padding:70px 0;text-align:center;color:var(--muted)}input{accent-color:var(--primary)}@media(max-width:650px){body{padding:10px}header,footer{padding:16px}main{margin:0 16px}.summary{margin-inline:16px}.row{grid-template-columns:18px 48px minmax(100px,1fr) 68px;gap:9px}.location{display:none}footer{flex-wrap:wrap}footer .note{flex-basis:100%}}
</style>
<button id="reopen" style="display:none">旧版本图片</button><section class="window" role="dialog" aria-modal="true" aria-label="旧版本图片">
<header><h1>旧版本图片</h1><button id="scan">↻ 重新扫描</button><button aria-label="关闭">×</button></header>
<nav role="tablist"><button role="tab" aria-selected="true" data-tab="available">待清理</button><button role="tab" aria-selected="false" data-tab="protected">已保留</button><button role="tab" aria-selected="false" data-tab="recycle">回收记录</button></nav>
<div class="summary"><strong id="summary"></strong><span id="selected"></span></div>
<main id="rows"></main>
<div class="error" role="alert" id="error"></div>
<footer><span class="note" id="note">后台自动清理，移除后保留 30 天备份</span><button id="close">关闭</button></footer>
</section>
<script>
const items=[{id:1,title:'文章配图 版本 3',detail:'12 月 5 日后自动清理，未被引用',location:'本地文件',size:1.2},{id:2,title:'拼接长图 版本 2',detail:'12 月 5 日后自动清理，未被引用',location:'本地文件',size:.8},{id:3,title:'文章配图 版本 1',detail:'等待其他设备确认后自动处理',location:'图床',size:1.6}];
const kept=[{id:11,title:'图片原稿',detail:'原图',location:'本地文件',size:2.4},{id:12,title:'文章配图 版本 6',detail:'已发布文章使用',location:'图床',size:1.2},{id:13,title:'文章配图 版本 8',detail:'最近 5 个版本',location:'本地文件',size:1.1},{id:14,title:'专题插图',detail:'其他工程正在使用',location:'本地文件',size:1.4},{id:15,title:'历史图片',detail:'历史图床图片，用途不明',location:'图床',size:2.3}];
let tab='available',recycled=[{id:21,title:'拼接长图 版本 1',detail:'可恢复至 2026-12-26',location:'回收区',size:.7}],manual=new Set();
const $=id=>document.getElementById(id);function row(item,index){const action=tab==='available'?`<button data-keep="${item.id}">保留</button>`:tab==='recycle'?`<button data-restore="${item.id}">恢复</button>`:`<span class="size">${item.size.toFixed(1)} MB</span>`;return `<div class="row"><span></span><div class="thumb ${index%3===1?'mint':index%3===2?'pink':''}"></div><div><div class="name">${item.title}</div><div class="detail">${item.detail}</div></div><span class="location">${item.location}</span>${action}</div>`}
function render(){let rows=tab==='available'?items.filter(x=>!manual.has(x.id)):tab==='protected'?[...kept,...items.filter(x=>manual.has(x.id)).map(x=>({...x,detail:'人工保留'}))]:recycled;$('rows').innerHTML=rows.length?rows.map(row).join(''):'<div class="empty">没有待处理的旧版本图片</div>';$('summary').textContent=tab==='available'?`待清理 ${rows.length} 个文件，预计释放 ${rows.reduce((n,x)=>n+x.size,0).toFixed(1)} MB`:tab==='protected'?`${rows.length} 个文件仍需保留`:`${rows.length} 条回收记录`;$('selected').textContent='';$('note').textContent=tab==='recycle'?'移除后的图片备份保留 30 天':tab==='protected'?'仍被使用或用途不明的图片不会进入清理':'后台自动清理，移除后保留 30 天备份'}
document.querySelector('nav').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));render()};$('rows').onclick=e=>{const id=Number(e.target.dataset.keep||e.target.dataset.restore);if(!id)return;const keeping=Boolean(e.target.dataset.keep);e.target.textContent=keeping?'已保留':'已恢复';e.target.disabled=true;setTimeout(()=>{if(keeping)manual.add(id);else{const item=recycled.find(x=>x.id===id);kept.push({...item,detail:'恢复后保留'});recycled=recycled.filter(x=>x.id!==id)}render()},1000)};$('scan').onclick=()=>{$('scan').disabled=true;$('scan').textContent='扫描中';setTimeout(()=>{$('scan').textContent='已更新';setTimeout(()=>{$('scan').disabled=false;$('scan').textContent='↻ 重新扫描'},1000)},650)};document.querySelectorAll('[aria-label="关闭"],#close').forEach(b=>b.onclick=()=>{document.querySelector('.window').style.display='none';$('reopen').style.display='block'});$('reopen').onclick=()=>{document.querySelector('.window').style.display='block';$('reopen').style.display='none'};render();
</script>
</html>
