[package]
name = "wechat-creator-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
arboard = "3.7"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.39", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tokio = { version = "1", features = ["sync", "fs", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
lol_html = "2"
zip = { version = "6", default-features = false }
serde_json = "1"
walkdir = "2"
tempfile = "3"
html-escape = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
scraper = "0.26"
ammonia = "4"
htmd = "0.5"
regex-lite = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
rmcp = { version = "=3.10.0", features = ["transport-streamable-http-server"] }
schemars = "1"
subtle = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
