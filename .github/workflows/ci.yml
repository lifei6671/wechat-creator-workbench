name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and sync server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/sync-server/package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: npm ci --prefix apps/sync-server
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm web:build
      - run: npm test --prefix apps/sync-server

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --debug --no-bundle

  browser:
    name: Browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
        id: browser-tests
      - uses: actions/upload-artifact@v6
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        with:
          name: playwright-${{ matrix.os }}
          path: output/playwright/test-results
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [native, browser]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node -e "if (process.env.NATIVE !== 'success' || process.env.BROWSER !== 'success') process.exit(1)"
        env:
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.browser.result }}
